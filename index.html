    <title>Da Nang Trip 2026</title>
    <style>
      :root{background:#f5f8f6;color:#173333;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      body{margin:0;min-width:320px}.boot-shell{min-height:100vh;background:#f5f8f6}.boot-head{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid #d9e4df;font-weight:800}.boot-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#087c78;color:#fff}.boot-content{max-width:1440px;margin:auto;padding:18px 14px 96px}.boot-title{width:210px;height:32px;margin:4px 0 18px;border-radius:10px}.boot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.boot-card{height:100px;border:1px solid #d9e4df;border-radius:18px;background:#fff}.boot-pulse{background:linear-gradient(90deg,#e8efec 25%,#f7f9f8 50%,#e8efec 75%);background-size:200% 100%;animation:boot-load 1.2s infinite}@keyframes boot-load{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.boot-pulse{animation:none}}@media(min-width:700px){.boot-content{padding:34px 36px 50px}.boot-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.boot-card{height:120px}}@media(min-width:1050px){.boot-head{width:236px;height:100vh;position:fixed;align-items:flex-start;padding:28px 16px;background:#103d3c;color:#fff;border:0}.boot-content{margin-left:268px}.boot-mark{margin-top:-4px}}
